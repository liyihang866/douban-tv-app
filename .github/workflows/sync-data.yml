name: 每日同步豆瓣电视剧数据

on:
  schedule:
    # 每天 8:00, 14:00, 20:00 (北京时间)
    - cron: '0 0,6,12 * * *'  # UTC时间，对应北京时间 8:00, 14:00, 20:00
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
      
      - name: 设置 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: 安装依赖
        run: |
          npm install
          npm install puppeteer
      
      - name: 创建抓取脚本
        run: |
          cat > fetch-data.js << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          
          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            await page.goto('https://movie.douban.com/tv/', {
              waitUntil: 'networkidle2'
            });
            
            // 抓取数据的逻辑
            // TODO: 实现完整的数据抓取逻辑
            
            await browser.close();
            
            // 保存数据
            const data = {
              fetch_date: new Date().toISOString().split('T')[0],
              total_count: 0,
              data: []
            };
            
            fs.writeFileSync('data.json', JSON.stringify(data, null, 2));
          })();
          EOF
      
      - name: 运行抓取脚本
        run: node fetch-data.js
      
      - name: 提交更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "更新数据: $(date '+%Y-%m-%d %H:%M:%S')"
          git push